<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Auto Sales</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        :root {
            --primary: #c2a661; /* Dorado Premium */
            --primary-hover: #a1884c;
            --dark: #121212;
            --dark-panel: #1e1e1e;
            --text-light: #f5f5f5;
            --text-gray: #a0a0a0;
            --danger: #e63946;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
        }

        /* Navbar & Hero */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), url('https://images.unsplash.com/photo-1560958089-b8a1929cea89?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') center/cover;
            padding: 4rem 2rem;
            text-align: center;
            border-bottom: 3px solid var(--primary);
        }

        .hero h1 { font-size: 3rem; margin: 0; color: var(--primary); letter-spacing: 2px; }
        .hero p { font-size: 1.2rem; color: var(--text-gray); }

        .container { max-width: 1300px; margin: 2rem auto; padding: 0 1rem; }

        /* Filtros */
        .filters-section {
            background: var(--dark-panel);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid #333;
        }

        .filters-section h3 { margin: 0 1rem 0 0; color: var(--primary); }
        .filter-input {
            flex: 1;
            min-width: 150px;
            padding: 0.8rem;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            font-family: inherit;
        }
        .filter-input:focus { outline: none; border-color: var(--primary); }

        /* Layout Principal */
        .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

        /* Catálogo de Autos (Cards) */
        .showroom {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            align-content: start;
        }

        .car-card {
            background: var(--dark-panel);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.3s, border-color 0.3s;
            position: relative;
            overflow: hidden;
        }
        .car-card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .car-brand { color: var(--text-gray); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .car-model { font-size: 1.4rem; font-weight: 700; margin: 0.5rem 0; }
        .car-year { background: #333; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
        .car-price { color: var(--primary); font-size: 1.5rem; font-weight: 700; margin-top: 1rem; }
        
        .car-actions { margin-top: 1.5rem; display: flex; gap: 10px; }
        .btn-action {
            flex: 1; padding: 0.5rem; border: none; border-radius: 4px;
            cursor: pointer; font-weight: 600; color: white; transition: 0.2s;
        }
        .btn-edit { background: #4a5568; } .btn-edit:hover { background: #2d3748; }
        .btn-delete { background: var(--danger); } .btn-delete:hover { background: #c53030; }

        /* Formulario de Administración */
        .admin-panel {
            background: var(--dark-panel);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #333;
            height: fit-content;
        }
        .admin-panel h2 { color: var(--primary); margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 1rem; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-gray); font-size: 0.9rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 0.8rem; background: #2a2a2a; border: 1px solid #444;
            color: white; border-radius: 4px; box-sizing: border-box; font-family: inherit;
        }
        
        .btn-submit {
            width: 100%; padding: 1rem; background: var(--primary); color: var(--dark);
            border: none; border-radius: 4px; font-weight: 700; font-size: 1rem; cursor: pointer;
            margin-top: 1rem; transition: 0.3s;
        }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-cancel {
            width: 100%; padding: 1rem; background: transparent; color: var(--text-gray);
            border: 1px solid #444; border-radius: 4px; cursor: pointer; margin-top: 10px; display: none;
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1><i class="fas fa-gem"></i> PREMIUM AUTO SALES</h1>
        <p>Exclusividad y rendimiento en cada kilómetro</p>
    </header>

    <div class="container">
        <!-- Sección de Filtros -->
        <div class="filters-section">
            <h3><i class="fas fa-search"></i> Buscar:</h3>
            <select id="filtroMarca" class="filter-input" onchange="filtrarInventario()">
                <option value="">Todas las Marcas</option>
                <option value="Toyota">Toyota</option>
                <option value="Honda">Honda</option>
                <option value="Ford">Ford</option>
                <option value="BMW">BMW</option>
                <option value="Mercedes-Benz">Mercedes-Benz</option>
                <option value="Audi">Audi</option>
            </select>
            <input type="text" id="filtroModelo" class="filter-input" placeholder="Modelo (Ej. Hilux)" onkeyup="filtrarInventario()">
            <input type="number" id="filtroAnio" class="filter-input" placeholder="Año (Ej. 2024)" onkeyup="filtrarInventario()">
        </div>

        <div class="main-layout">
            <!-- Exhibición de Autos -->
            <div class="showroom" id="showroom">
                <!-- Las tarjetas se generan por JS -->
            </div>

            <!-- Panel de Administración -->
            <div class="admin-panel">
                <h2 id="formTitle"><i class="fas fa-plus"></i> Ingresar Vehículo</h2>
                <form id="formAuto">
                    <div class="form-group">
                        <label>Marca</label>
                        <select id="marca" required>
                            <option value="">Seleccionar...</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Honda">Honda</option>
                            <option value="Ford">Ford</option>
                            <option value="BMW">BMW</option>
                            <option value="Mercedes-Benz">Mercedes-Benz</option>
                            <option value="Audi">Audi</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Modelo</label>
                        <input type="text" id="modelo" required>
                    </div>
                    <div class="form-group">
                        <label>Año</label>
                        <input type="number" id="anio" min="1990" max="2026" required>
                    </div>
                    <div class="form-group">
                        <!-- Actualizado a Quetzales -->
                        <label>Precio (Q)</label>
                        <input type="number" id="precio" step="0.01" required>
                    </div>
                    <button type="submit" class="btn-submit" id="btnSubmit">Guardar en Inventario</button>
                    <button type="button" class="btn-cancel" id="btnCancel" onclick="cancelarEdicion()">Cancelar Edición</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/autos";
        let editandoId = null;
        let inventarioGlobal = []; 

        // Actualizado a región Guatemala y moneda Quetzal
        const formatter = new Intl.NumberFormat('es-GT', { style: 'currency', currency: 'GTQ' });

        // 1. CARGAR DATOS DESDE LA API
        async function cargarAutos() {
            try {
                const response = await fetch(API_URL);
                inventarioGlobal = await response.json();
                renderizarAutos(inventarioGlobal);
            } catch (error) {
                console.error("Error conectando al backend:", error);
            }
        }

        // 2. RENDERIZAR LAS TARJETAS Y APLICAR FILTROS
        function filtrarInventario() {
            const marca = document.getElementById('filtroMarca').value.toLowerCase();
            const modelo = document.getElementById('filtroModelo').value.toLowerCase();
            const anio = document.getElementById('filtroAnio').value;

            const autosFiltrados = inventarioGlobal.filter(auto => {
                const matchMarca = auto.marca.toLowerCase().includes(marca);
                const matchModelo = auto.modelo.toLowerCase().includes(modelo);
                const matchAnio = anio === '' || auto.anio.toString() === anio;
                return matchMarca && matchModelo && matchAnio;
            });

            renderizarAutos(autosFiltrados);
        }

        function renderizarAutos(autos) {
            const showroom = document.getElementById('showroom');
            showroom.innerHTML = '';

            if (autos.length === 0) {
                showroom.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #a0a0a0;">No se encontraron vehículos.</p>';
                return;
            }

            autos.forEach(auto => {
                const autoData = JSON.stringify(auto).replace(/"/g, '&quot;');
                const card = document.createElement('div');
                card.className = 'car-card';
                card.innerHTML = `
                    <div class="car-brand">${auto.marca}</div>
                    <div class="car-model">${auto.modelo} <span class="car-year">${auto.anio}</span></div>
                    <div class="car-price">${formatter.format(auto.precio)}</div>
                    <div class="car-actions">
                        <button class="btn-action btn-edit" onclick="prepararEdicion(${autoData})"><i class="fas fa-edit"></i> Editar</button>
                        <button class="btn-action btn-delete" onclick="eliminarAuto(${auto.id})"><i class="fas fa-trash"></i> Vender/Borrar</button>
                    </div>
                `;
                showroom.appendChild(card);
            });
        }

        // 3. CREAR Y ACTUALIZAR
        document.getElementById('formAuto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const autoData = {
                marca: document.getElementById('marca').value,
                modelo: document.getElementById('modelo').value,
                anio: parseInt(document.getElementById('anio').value),
                precio: parseFloat(document.getElementById('precio').value)
            };

            const metodo = editandoId ? 'PUT' : 'POST';
            const url = editandoId ? `${API_URL}/${editandoId}` : API_URL;

            await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(autoData)
            });

            cancelarEdicion();
            cargarAutos(); // Recarga los datos frescos de la BD
        });

        // 4. ELIMINAR
        async function eliminarAuto(id) {
            if (confirm(`¿Retirar este vehículo del inventario?`)) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                cargarAutos();
            }
        }

        // FUNCIONES DE INTERFAZ
        function prepararEdicion(auto) {
            editandoId = auto.id;
            document.getElementById('marca').value = auto.marca;
            document.getElementById('modelo').value = auto.modelo;
            document.getElementById('anio').value = auto.anio;
            document.getElementById('precio').value = auto.precio;
            
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit"></i> Editar Vehículo';
            document.getElementById('btnSubmit').innerText = 'Actualizar Datos';
            document.getElementById('btnCancel').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            editandoId = null;
            document.getElementById('formAuto').reset();
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus"></i> Ingresar Vehículo';
            document.getElementById('btnSubmit').innerText = 'Guardar en Inventario';
            document.getElementById('btnCancel').style.display = 'none';
        }

        // Inicializar
        cargarAutos();
    </script>
</body>
</html>
